<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Hawaiian Monk Seal</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 40px;
            margin: 10px 0 0 10px;
            padding: 10px 14px;
            background: #77825c;
            border: 1px solid #4b531e;
            border-right: none;
            border-radius: 14px 0 0 0;
        }
        .topbar h1 {
            margin: 0;
            font-size: 45px;
            font-weight: 400;
            color: #888;
        }

        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: 90px 1fr 500px;
        }

        .main {
            background: #4d5d53;
            padding: 16px 20px;
            color: #f8fff7;
        }
        .main h2 {
            margin: 0;
            font-size: 50px;
            font-weight: 400;
        }
        .main p {
            max-width: 540px;
            margin: 0 0 0 55px;
            font-size: 22px;
            line-height: 1.35;
        }

        .sidebar {
            background: #738276;
            border-left: 2px solid #282f27;
            padding: 30px 16px;
            color: #f8fff7;
        }
        .sidebar h3 {
            margin: 0 0 12px 46px;
            font-size: 32px;
            font-weight: 400;
        }
        .sidebar p {
            margin: 0;
            font-size: 17px;
            line-height: 1.4;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .image { margin-left: 0; height: 220px; font-size: 50px; }
            .main p { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>The Hawaiian Monk Seal</h1>
    </div>

    <div class="layout">
        <div></div>

        <main class="main">
            <h2>About the Hawaiian Monk Seal</h2>
            <p>The Hawaiian Monk Seal/known to locals as "Īlio-holo-i-ka-uaua" is...</p>
        </main>

        <aside class="sidebar">
            <h3>TEXT</h3>
            <p>aaaaaaaa </p>
        </aside>
    </div>
</div>
</body>
</html>
